name: Bug report
description: Report a problem with one of the Met Office simulation systems.
title: "[<system>] <short description>"
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. This repository is used to
        **triage** issues across the internal simulation systems repositories;
        it is not where the code itself lives.

        After submitting, you can optionally set the **Priority** field
        (Urgent, High, Medium, Low) in the issue sidebar. The triage team
        will review it.
  - type: dropdown
    id: system
    attributes:
      label: Affected system(s)
      description: Which repository or system does this bug affect?
      multiple: true
      options:
        - casim
        - lfric_apps
        - lfric_core
        - moci
        - monc
        - mule
        - rose_picker
        - shumlib
        - socrates
        - socrates-spectral
        - ukca
        - um
        - gcom
        - jules
        - jules-internal
        - um_aux
        - um_doc
        - um_meta
        - other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / revision
      description: Release tag, branch or revision number you were using.
      placeholder: e.g. vn13.2, working copy at revision 12345
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem, including any error messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Platform, suite/app name, configuration, or command used.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid filing a duplicate.
          required: true
