name: Refresh internal dashboard

# Send the `public-issues-updated` repository dispatch event to 
# simulation-systems-internal

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - closed
      - deleted
      - labeled
      - unlabeled
      - assigned
      - unassigned
      - transferred
      - field_added
      - field_removed
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    if: github.repository == 'MetOffice/simulation-systems'
    runs-on: ubuntu-slim
    steps:
      - name: Create dashboard dispatch token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.DASHBOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.DASHBOARD_APP_PRIVATE_KEY }}
          owner: MetOffice
          repositories: simulation-systems-internal
          permission-contents: write

      - name: Request dashboard refresh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          gh api --method POST
          repos/MetOffice/simulation-systems-internal/dispatches
          -f event_type=public-issues-updated
      
